---
- name: Bring tunnel interface down (ifupdown)
  ansible.builtin.command:
    argv: [ifdown, --force, "{{ tunnel_name }}"]
  listen: Recreate tunnel interface (ifupdown)
  changed_when: true
  failed_when: false

- name: Bring tunnel interface up (ifupdown)
  ansible.builtin.command:
    argv: [ifup, "{{ tunnel_name }}"]
  listen: Recreate tunnel interface (ifupdown)
  changed_when: true

- name: Delete tunnel device (networkd)
  ansible.builtin.command:
    argv: [ip, link, delete, dev, "{{ tunnel_name }}"]
  listen: Recreate tunnel device (networkd)
  changed_when: true
  failed_when: false

- name: Reload systemd-networkd
  ansible.builtin.command:
    argv: [networkctl, reload]
  listen:
    - Recreate tunnel device (networkd)
    - Reload systemd-networkd
  changed_when: true

- name: Restart underlay GRO unit
  ansible.builtin.systemd_service:
    name: "{{ tunnel_gro_unit }}"
    state: restarted
    daemon_reload: true
