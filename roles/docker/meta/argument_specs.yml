---
argument_specs:
  main:
    short_description: Docker Engine from the official Docker apt repository
    options:
      docker_apt_url:
        type: str
        description: Base URL of the Docker apt repository.
      docker_apt_channel:
        type: str
        choices: [stable, test]
        description: Repository component.
      docker_apt_key_url:
        type: str
        description: URL of the repository signing key.
      docker_apt_key_path:
        type: path
        description: Where the signing key is stored (referenced by Signed-By).
      docker_apt_key_fingerprint:
        type: str
        description: Expected fingerprint of the signing key.
      docker_packages:
        type: list
        elements: str
        description: Packages to install.
      docker_packages_state:
        type: str
        choices: [present, latest]
        description: present keeps the installed version, latest upgrades.
      docker_conflicting_packages:
        type: list
        elements: str
        description: Packages removed before installation.
      docker_daemon_options:
        type: dict
        description: Content of /etc/docker/daemon.json.
      docker_users:
        type: list
        elements: str
        description: Users added to the docker group.
