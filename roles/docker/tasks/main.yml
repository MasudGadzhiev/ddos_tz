---
- name: Remove conflicting packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg, python3-debian]
    state: present

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ docker_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_key_download

- name: Read signing key fingerprint
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, "{{ docker_apt_key_path }}"]
  register: docker_apt_key_info
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and docker_apt_key_download is changed)

- name: Verify signing key fingerprint
  ansible.builtin.assert:
    that: docker_apt_key_fingerprint in docker_apt_key_info.stdout
    fail_msg: "{{ docker_apt_key_path }} does not match fingerprint {{ docker_apt_key_fingerprint }}"
    quiet: true
  when: docker_apt_key_info is not skipped

- name: Add Docker apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: ["{{ docker_apt_url }}"]
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: ["{{ docker_apt_channel }}"]
    architectures: ["{{ docker_dpkg_architectures[ansible_facts['architecture']] }}"]
    signed_by: "{{ docker_apt_key_path }}"
    state: present
  notify: Update apt cache

- name: Refresh apt cache if the repository was added
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: "{{ docker_packages_state }}"

- name: Create /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json(indent=2) }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
