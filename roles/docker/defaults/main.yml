---
docker_apt_url: https://download.docker.com/linux/debian
docker_apt_channel: stable
docker_apt_key_url: "{{ docker_apt_url }}/gpg"
docker_apt_key_path: /etc/apt/keyrings/docker.asc
docker_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_packages_state: present

docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc

docker_daemon_options:
  log-driver: local
  log-opts:
    max-size: 10m
    max-file: "5"
  live-restore: true

docker_users: []
