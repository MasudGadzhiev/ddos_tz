---
argument_specs:
  main:
    short_description: Prometheus node_exporter from the Debian repository
    options:
      node_exporter_package:
        type: str
        description: Debian package name.
      node_exporter_service:
        type: str
        description: systemd unit shipped by the package.
      node_exporter_listen_ip:
        type: str
        description: Address to listen on (the private IP in this project).
      node_exporter_port:
        type: int
        description: TCP port to listen on.
      node_exporter_collectors_enabled:
        type: list
        elements: str
        description: Collectors to enable in addition to the defaults.
      node_exporter_collectors_disabled:
        type: list
        elements: str
        description: Default collectors to disable.
      node_exporter_netdev_device_exclude:
        type: str
        description: Regex of network devices excluded from netdev metrics.
      node_exporter_textfile_directory:
        type: path
        description: Directory scanned by the textfile collector.
      node_exporter_extra_args:
        type: list
        elements: str
        description: Extra command-line flags.
