---
node_exporter_package: prometheus-node-exporter
node_exporter_service: prometheus-node-exporter

node_exporter_listen_ip: 0.0.0.0
node_exporter_port: 9100

node_exporter_collectors_enabled:
  - qdisc
node_exporter_collectors_disabled: []

node_exporter_netdev_device_exclude: "^(lo|gre0|gretap0|erspan0|tunl0)$"

node_exporter_textfile_directory: /var/lib/prometheus/node-exporter

node_exporter_extra_args: []
